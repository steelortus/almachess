apiVersion: v1
kind: Service
metadata:
  name: notation-service
  namespace: almachess
spec:
  selector:
    app: notation-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notation-service
  namespace: almachess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notation-service
  template:
    metadata:
      labels:
        app: notation-service
    spec:
      containers:
        - name: notation-service
          image: almachess:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: MAIN_CLASS
              value: de.htwg.softwarearchitecture.almachess.services.NotationService
            - name: NOTATION_HOST
              valueFrom:
                configMapKeyRef:
                  name: almachess-config
                  key: NOTATION_HOST
            - name: NOTATION_PORT
              valueFrom:
                configMapKeyRef:
                  name: almachess-config
                  key: NOTATION_PORT
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 15
