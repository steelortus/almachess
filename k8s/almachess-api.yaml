apiVersion: v1
kind: Service
metadata:
  name: almachess-api
  namespace: almachess
spec:
  selector:
    app: almachess-api
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: almachess-api
  namespace: almachess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: almachess-api
  template:
    metadata:
      labels:
        app: almachess-api
    spec:
      containers:
        - name: almachess-api
          image: almachess:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: MAIN_CLASS
              value: de.htwg.softwarearchitecture.almachess.api.Server
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: almachess-secrets
                  key: POSTGRES_PASSWORD
            # Lichess tokens — optional. If the Secret keys are empty the
            # API starts with Lichess integration disabled, same as a local
            # run without env vars.
            - name: LICHESS_BOARD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: almachess-secrets
                  key: LICHESS_BOARD_TOKEN
                  optional: true
            - name: LICHESS_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: almachess-secrets
                  key: LICHESS_BOT_TOKEN
                  optional: true
          envFrom:
            - configMapRef:
                name: almachess-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 25
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 15
