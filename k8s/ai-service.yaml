apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: almachess
spec:
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: almachess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: almachess:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: MAIN_CLASS
              value: de.htwg.softwarearchitecture.almachess.services.AiService
            - name: AI_HOST
              valueFrom:
                configMapKeyRef:
                  name: almachess-config
                  key: AI_HOST
            - name: AI_PORT
              valueFrom:
                configMapKeyRef:
                  name: almachess-config
                  key: AI_PORT
            - name: AI_ENGINE
              valueFrom:
                configMapKeyRef:
                  name: almachess-config
                  key: AI_ENGINE
            - name: STOCKFISH_PATH
              valueFrom:
                configMapKeyRef:
                  name: almachess-config
                  key: STOCKFISH_PATH
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
