# Demo secret — replace before deploying to anything reachable from the
# internet. For real use create the Secret out-of-band and drop this file:
#
#   kubectl create secret generic almachess-secrets \
#     --namespace almachess \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=LICHESS_BOARD_TOKEN=... \
#     --from-literal=LICHESS_BOT_TOKEN=...
#
# Lichess token keys are optional — leave them out (or empty) to run with the
# integration disabled.
apiVersion: v1
kind: Secret
metadata:
  name: almachess-secrets
  namespace: almachess
type: Opaque
stringData:
  POSTGRES_PASSWORD: "almachess"
  LICHESS_BOARD_TOKEN: ""
  LICHESS_BOT_TOKEN: ""
