server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Main-API (game state, fen, pgn) -------------------------------------
  location /api/ {
    proxy_pass http://almachess-api:8080;
    proxy_set_header Host $host;
  }
  location = /health {
    proxy_pass http://almachess-api:8080/health;
  }

  # --- NotationService ------------------------------------------------------
  location /notation/ {
    proxy_pass http://notation-service:8081;
  }
  location = /notation/health {
    proxy_pass http://notation-service:8081/health;
  }

  # --- AiService ------------------------------------------------------------
  location /ai/ {
    proxy_pass http://ai-service:8082;
  }
  location = /ai/health {
    proxy_pass http://ai-service:8082/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
