server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Main-API (game state, fen, pgn) -------------------------------------
  location /api/ {
    proxy_pass http://almachess-api:8083;
    proxy_set_header Host $host;
  }

  # --- Tournament log/event stream (Server-Sent Events) --------------------
  # NDJSON-style SSE: keep the connection open for the full tournament,
  # disable nginx buffering so log lines reach the browser without
  # accumulating in an intermediate buffer.
  location /api/tournament/log/stream {
    proxy_pass http://almachess-api:8083;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
  location = /health {
    proxy_pass http://almachess-api:8083/health;
  }

  # --- NotationService ------------------------------------------------------
  location /notation/ {
    proxy_pass http://notation-service:8084;
  }
  location = /notation/health {
    proxy_pass http://notation-service:8084/health;
  }

  # --- AiService ------------------------------------------------------------
  location /ai/ {
    proxy_pass http://ai-service:8082;
  }
  location = /ai/health {
    proxy_pass http://ai-service:8082/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires off;
  }
}
