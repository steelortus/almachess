# Akka picks up its license key from system property `akka.license-key`.
# We bridge from the AKKA_LICENSE_KEY env var so docker-compose / k8s can
# inject it without changing config files. Register for a free key at
# https://akka.io/key — without one the actor system terminates after ~15
# minutes ("Akka terminated. Obtain free keys at https://akka.io/key").
akka.license-key = ${?AKKA_LICENSE_KEY}

# The tournament module holds long-lived NDJSON streams (one for the
# tournament events, one per running game) AND fires short POST /move
# requests against the same host. Akka HTTP's default per-host pool of
# 4 connections gets fully occupied by the streams, leaving the POSTs
# to wait forever. Generous limits here so a multi-game tournament has
# room for streams + bursty move submissions on the same host pool.
akka.http.host-connection-pool {
  max-connections = 64
  max-open-requests = 256
  response-entity-subscription-timeout = 30 seconds
}
